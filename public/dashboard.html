<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pro Short Link Dashboard</title>
<style>

    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    }
    
    body{
    background:#f4f7fc;
    display:flex;
    min-height:100vh;
    }
    
    .sidebar{
    width:260px;
    background:#ffffff;
    padding:25px;
    border-right:1px solid #e5e7eb;
    }
    
    .logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
    color:#2563eb;
    }
    
    .menu{
    display:flex;
    flex-direction:column;
    gap:12px;
    }
    
    .menu a{
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    color:#374151;
    font-weight:600;
    transition:.3s;
    cursor:pointer;
    }
    
    .menu a:hover{
    background:#2563eb;
    color:white;
    }
    
    .main{
    flex:1;
    padding:30px;
    }
    
    .section{
    display:none;
    }
    
    .active{
    display:block;
    }
    
    .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    }
    
    .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
    }
    
    .card,
    .box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    }
    
    .card h3{
    font-size:14px;
    color:#6b7280;
    margin-bottom:10px;
    }
    
    .card h2{
    font-size:30px;
    }
    
    table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:20px;
    overflow:hidden;
    }
    
    th{
    background:#2563eb;
    color:white;
    }
    
    th,td{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    }
    
    .main-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    }
    
    .delete-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    }
    
    input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:10px;
    }
    
    </style>
    
</head>

<body>

    <div class="sidebar">
    
    <div class="logo">
    🔥 Pro Short Link
    </div>
    
    <div class="menu">
    
    <a onclick="showSection('dashboardSection')">
    📊 Dashboard
    </a>
    
    <a onclick="showSection('linksSection')">
    🔗 My Links
    </a>
    
    <a onclick="showSection('createSection')">
    ➕ Create Link
    </a>
    
    <a href="/">
    🚪 Logout
    </a>
    
    </div>
    
    </div>
    
    <div class="main">
    
    <div id="dashboardSection" class="section active">
    
    <div class="header">
    
    <h1>
    Welcome Back 👋
    </h1>
    
    </div>
    
    <div class="cards">
    
    <div class="card">
    <h3>Total Views</h3>
    <h2 id="totalViews">0</h2>
    </div>
    
    <div class="card">
    <h3>Total Earnings</h3>
    <h2 id="totalEarnings">$0.00</h2>
    </div>
    
    <div class="card">
    <h3>Average CPM</h3>
    <h2 id="averageCPM">$0</h2>
    </div>
    
    <div class="card">
    <h3>Total Links</h3>
    <h2 id="totalLinks">0</h2>
    </div>
    
    </div>
    
    </div>
    
    <div id="createSection" class="section">
    
    <div class="box">
    
    <h2>
    ➕ Create New Link
    </h2>
    
    <br>
    
    <input
    id="urlInput"
    type="text"
    placeholder="https://example.com">
    
    <button
    class="main-btn"
    onclick="createLink()">
    Create Link </button>
    
    <br><br>
    
    <div id="newLinkResult">
    </div>
    
    </div>
    
    </div>
    
    <div id="linksSection" class="section">
    
    <h2 style="margin-bottom:15px">
    🔗 My Links
    </h2>
    
    <table>
    
    <thead>
    
    <tr>
    
    <th>Short Link</th>
    <th>Views</th>
    <th>Earnings</th>
    <th>Delete</th>
    
    </tr>
    
    </thead>
    
    <tbody id="linksTable">
    
    <tr>
    
    <td colspan="4">
    
    Loading...
    
    </td>
    
    </tr>
    
    </tbody>
    
    </table>
    
    </div>
    
    </div>
    <script>

        function showSection(section){
        
        document
        .querySelectorAll(".section")
        .forEach(item => {
        
        item.classList.remove("active");
        
        });
        
        document
        .getElementById(section)
        .classList.add("active");
        
        }
        
        async function loadStats(){
        
        try{
        
        const response = await fetch(
        "/stats",
        {
        headers:{
        Authorization:
        localStorage.getItem("token")
        }
        }
        );
        
        const data =
        await response.json();
        
        document.getElementById(
        "totalViews"
        ).innerText =
        data.totalViews || 0;
        
        document.getElementById(
        "totalEarnings"
        ).innerText =
        "$" +
        Number(
        data.totalEarnings || 0
        ).toFixed(4);
        
        document.getElementById(
        "averageCPM"
        ).innerText =
        "$" +
        Number(
        data.averageCPM || 0
        ).toFixed(2);
        
        document.getElementById(
        "totalLinks"
        ).innerText =
        data.totalLinks || 0;
        
        }catch(error){
        
        console.log(error);
        
        }
        
        }
        
        async function loadLinks(){
        
        try{
        
        const response =
        await fetch(
        "/my-links",
        {
        headers:{
        Authorization:
        localStorage.getItem("token")
        }
        }
        );
        
        const links =
        await response.json();
        
        const table =
        document.getElementById(
        "linksTable"
        );
        
        if(!links.length){
        
        table.innerHTML = `
        <tr>
        <td colspan="4">
        No Links Yet
        </td>
        </tr>
        `;
        
        return;
        
        }
        
        table.innerHTML = "";
        
        links.forEach(link=>{
        
        table.innerHTML += `
        <tr>
        
        <td>
        https://${location.host}/s/${link.shortCode}
        </td>
        
        <td>
        ${link.clicks}
        </td>
        
        <td>
        $${Number(
        link.earnings || 0
        ).toFixed(4)}
        </td>
        
        <td>
        
        <button
        class="delete-btn"
        onclick="deleteLink('${link._id}')">
        
        Delete
        
        </button>
        
        </td>
        
        </tr>
        `;
        
        });
        
        }catch(error){
        
        console.log(error);
        
        }
        
        }
        
        async function deleteLink(id){
        
        if(
        !confirm(
        "Delete this link?"
        )
        ){
        return;
        }
        
        try{
        
        await fetch(
        `/delete/${id}`,
        {
        method:"DELETE",
        
        headers:{
        Authorization:
        localStorage.getItem("token")
        }
        }
        );
        
        loadLinks();
        loadStats();
        
        }catch(error){
        
        console.log(error);
        
        }
        
        }
        
        async function createLink(){
        
        const originalUrl =
        document.getElementById(
        "urlInput"
        ).value;
        
        if(!originalUrl){
        
        alert("Enter URL");
        
        return;
        
        }
        
        try{
        
        const response =
        await fetch(
        "/shorten",
        {
        method:"POST",
        
        headers:{
        "Content-Type":
        "application/json",
        
        Authorization:
        localStorage.getItem("token")
        },
        
        body:JSON.stringify({
        originalUrl
        })
        }
        );
        
        const data =
        await response.json();
        
        document.getElementById(
        "newLinkResult"
        ).innerHTML = `
        
        ✅ Link Created
        
        <br><br>
        
        <a href="${data.shortUrl}"
        target="_blank">
        
        ${data.shortUrl}
        
        </a>
        
        `;
        
        document.getElementById(
        "urlInput"
        ).value = "";
        
        loadLinks();
        loadStats();
        
        }catch(error){
        
        console.log(error);
        
        }
        
        }
        
        loadStats();
        loadLinks();
        
        </script>
         
    </body>
    

</html>
