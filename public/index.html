<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Short Link</title>
<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }
    
    body{
        background:linear-gradient(135deg,#0f172a,#1e293b);
        min-height:100vh;
        color:white;
        padding:40px;
    }
    
    .container{
        max-width:1000px;
        margin:auto;
    }
    
    .top-box{
        background:rgba(255,255,255,0.05);
        padding:30px;
        border-radius:20px;
        backdrop-filter:blur(10px);
        box-shadow:0 10px 30px rgba(0,0,0,0.3);
        margin-bottom:30px;
    }
    
    h1{
        text-align:center;
        margin-bottom:25px;
        font-size:40px;
    }
    
    .input-group{
        display:flex;
        gap:10px;
    }
    
    input{
        flex:1;
        padding:15px;
        border:none;
        border-radius:12px;
        outline:none;
        font-size:16px;
    }
    
    button{
        border:none;
        border-radius:12px;
        padding:15px 25px;
        cursor:pointer;
        font-size:16px;
        transition:0.3s;
    }
    
    .main-btn{
        background:linear-gradient(to right,#2563eb,#06b6d4);
        color:white;
    }
    
    .main-btn:hover{
        transform:scale(1.03);
    }
    
    .result{
        margin-top:20px;
        display:none;
        text-align:center;
    }
    
    .result a{
        color:#22d3ee;
        text-decoration:none;
        font-size:18px;
    }
    
    .copy-btn{
        margin-top:15px;
        background:#10b981;
        color:white;
        width:100%;
    }
    
    .stats{
        display:flex;
        gap:20px;
        margin-top:30px;
    }
    
    .card{
        flex:1;
        background:rgba(255,255,255,0.05);
        padding:20px;
        border-radius:15px;
        text-align:center;
    }
    
    .card h2{
        font-size:35px;
        margin-bottom:10px;
    }
    
    .links-box{
        background:rgba(255,255,255,0.05);
        padding:25px;
        border-radius:20px;
    }
    
    table{
        width:100%;
        border-collapse:collapse;
    }
    
    th,td{
        padding:15px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,0.1);
    }
    
    td a{
        color:#38bdf8;
        text-decoration:none;
    }
    
    .delete-btn{
        background:#ef4444;
        color:white;
        padding:10px 15px;
    }
    
    .delete-btn:hover{
        background:#dc2626;
    }
    
    @media(max-width:700px){
    
        .input-group{
            flex-direction:column;
        }
    
        .stats{
            flex-direction:column;
        }
    
        table{
            font-size:12px;
        }
    
    }
    
    </style>
    <body>
        <div class="container">
            <div class="top-box">

                <h1>🔥 Pro Short Link</h1>
                <div class="input-group">
                </div>
                <div class="result" id="result">
                    <p>Your Short Link:</p>
                </div>
                <div class="stats">
                    <div class="card">
                        <h2 id="totalLinks">0</h2>
                        <p>Total Links</p>
                    </div>
                    <div class="card">
                        <h2 id="totalClicks">0</h2>
                        <p>Total Clicks</p>
                        </div>
                    </div>
                </div>
                <div class="links-box">
                    <h2 style="margin-bottom:20px;">
                        📊 Your Links
                        </h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Short Link</th>
                                    <th>Clicks</th>
                                    <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody id="linksTable">
                                </tbody>
                            </div>
                        </div>
                        <script>

                            async function shortenLink(){
                            
                                const originalUrl =
                                document.getElementById("urlInput").value;
                            
                                if(!originalUrl){
                                    alert("Enter URL");
                                    return;
                                }
                            
                                const response =
                                await fetch("/shorten",{
                            
                                    method:"POST",
                            
                                    headers:{
                                        "Content-Type":"application/json"
                                    },
                            
                                    body:JSON.stringify({
                                        originalUrl
                                    })
                            
                                });
                            
                                const data =
                                await response.json();
                            
                                const resultDiv =
                                document.getElementById("result");
                            
                                const shortLink =
                                document.getElementById("shortLink");
                            
                                shortLink.href =
                                data.shortUrl;
                            
                                shortLink.innerText =
                                data.shortUrl;
                            
                                resultDiv.style.display =
                                "block";
                            
                                loadLinks();
                            }

        </td>

        <td>
            <button

    `;

});

links.length;

totalClicks;

</script>
</body>
</html>
