```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Short Link</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:450px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#2563eb;
margin-bottom:30px;
}

.tabs{
display:flex;
margin-bottom:25px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#e5e7eb;
font-weight:bold;
}

.tabs button.active{
background:#2563eb;
color:white;
}

.form{
display:none;
}

.form.active{
display:block;
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
}

.main-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

.main-btn:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🔥 Pro Short Link
</div>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showLogin()">
Login
</button>

<button
id="registerTab"
onclick="showRegister()">
Register
</button>

</div>

<div
id="loginForm"
class="form active">

<input
type="email"
id="loginEmail"
placeholder="Email">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button
class="main-btn"
onclick="loginUser()">
Login
</button>

</div>

<div
id="registerForm"
class="form">

<input
type="text"
id="registerUsername"
placeholder="Username">

<input
type="email"
id="registerEmail"
placeholder="Email">

<input
type="password"
id="registerPassword"
placeholder="Password">

<button
class="main-btn"
onclick="registerUser()">
Create Account
</button>

</div>

</div>

<script>

if(localStorage.getItem("token")){

window.location.href="/dashboard";

}

function showLogin(){

document
.getElementById("loginForm")
.classList.add("active");

document
.getElementById("registerForm")
.classList.remove("active");

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("registerTab")
.classList.remove("active");

}

function showRegister(){

document
.getElementById("registerForm")
.classList.add("active");

document
.getElementById("loginForm")
.classList.remove("active");

document
.getElementById("registerTab")
.classList.add("active");

document
.getElementById("loginTab")
.classList.remove("active");

}

async function registerUser(){

const username =
document.getElementById(
"registerUsername"
).value;

const email =
document.getElementById(
"registerEmail"
).value;

const password =
document.getElementById(
"registerPassword"
).value;

const response =
await fetch("/register",{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
username,
email,
password
})

});

const data =
await response.json();

alert(data.message);

showLogin();

}

async function loginUser(){

const email =
document.getElementById(
"loginEmail"
).value;

const password =
document.getElementById(
"loginPassword"
).value;

const response =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data =
await response.json();

if(data.token){

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"username",
data.username
);

window.location.href =
"/dashboard";

}else{

alert(data.message);

}

}

</script>

</body>
</html>
```
