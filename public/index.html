<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Short Link</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;color:white;padding:40px}
.container{max-width:1000px;margin:auto}
.top-box,.links-box{background:rgba(255,255,255,.05);padding:25px;border-radius:20px}
.top-box{margin-bottom:30px}
h1{text-align:center;margin-bottom:25px}
.input-group{display:flex;gap:10px}
input{flex:1;padding:15px;border:none;border-radius:12px}
button{border:none;border-radius:12px;padding:15px 25px;cursor:pointer}
.main-btn{background:#2563eb;color:white}
.copy-btn{background:#10b981;color:white;width:100%;margin-top:15px}
.result{display:none;text-align:center;margin-top:20px}
.stats{display:flex;gap:20px;margin-top:20px}
.card{flex:1;background:rgba(255,255,255,.05);padding:20px;border-radius:15px;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.delete-btn{background:#ef4444;color:white}
</style>
</head>
<body>
<div class="container">
<div class="top-box">
<h1>🔥 Pro Short Link</h1>
<div style="margin-bottom:20px;">
    Register
    </button>
    Login
    </button>
    </div>
<div class="input-group">
<input type="text" id="urlInput" placeholder="Paste your link here...">
<button class="main-btn" onclick="shortenLink()">Shorten</button>
</div>

<div class="result" id="result">
<p>Your Short Link:</p>
<a id="shortLink" target="_blank"></a>
<button class="copy-btn" onclick="copyLink()">Copy Link</button>
</div>

<div class="stats">
<div class="card"><h2 id="totalLinks">0</h2><p>Total Links</p></div>
<div class="card"><h2 id="totalClicks">0</h2><p>Total Clicks</p></div>
</div>
</div>

<div class="links-box">
<h2>📊 Your Links</h2>
<table>
<thead><tr><th>Short Link</th><th>Clicks</th><th>Delete</th></tr></thead>
<tbody id="linksTable"></tbody>
</table>
</div>
</div>

<script>
async function shortenLink(){
 const originalUrl=document.getElementById("urlInput").value;
 const response=await fetch("/shorten",{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Authorization": localStorage.getItem("token")
},
  body:JSON.stringify({originalUrl})
 });
 const data=await response.json();
 document.getElementById("shortLink").href=data.shortUrl;
 document.getElementById("shortLink").innerText=data.shortUrl;
 document.getElementById("result").style.display="block";
 loadLinks();
}

function copyLink(){
 navigator.clipboard.writeText(document.getElementById("shortLink").innerText);
 alert("Copied ✅");
}

async function loadLinks(){
    const response = await fetch("/links",{
    headers:{
        "Authorization": localStorage.getItem("token")
    }
});
 const links=await response.json();
 const table=document.getElementById("linksTable");
 table.innerHTML="";
 let totalClicks=0;

 links.forEach(link=>{
  totalClicks+=link.clicks;
  table.innerHTML+=`
  <tr>
   <td><a href="/${link.shortCode}" target="_blank">${window.location.origin}/${link.shortCode}</a></td>
   <td>${link.clicks}</td>
   <td><button class="delete-btn" onclick="deleteLink('${link._id}')">Delete</button></td>
  </tr>`;
 });

 document.getElementById("totalLinks").innerText=links.length;
 document.getElementById("totalClicks").innerText=totalClicks;
}

async function deleteLink(id){
 await fetch(`/delete/${id}`,{method:"DELETE"});
 loadLinks();
}
async function registerUser(){
const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response = await fetch("/register",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({
        username,
        email,
        password
    })

});

const data = await response.json();

alert(data.message);
}
async function loginUser(){
const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response = await fetch("/login",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({
        email,
        password
    })

});

const data = await response.json();

if(data.token){

    localStorage.setItem(
        "token",
        data.token
    );

    alert("Login Successful ✅");

    loadLinks();

}else{

    alert(data.message);

}
}
loadLinks();
</script>
</body>
</html>
