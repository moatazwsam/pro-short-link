<script>

const code =
window.location.pathname.split("/")[2];

let time = 5;

const timer =
document.getElementById("timer");

const btn =
document.getElementById("skipBtn");

const countdown = setInterval(()=>{

time--;

timer.innerText =
`Please wait ${time} seconds...`;

if(time <= 0){

clearInterval(countdown);

timer.innerText =
"Ready";

btn.style.display =
"inline-block";

}

},1000);

btn.onclick = ()=>{

window.location.href =
`/go/${code}`;

};

</script>
