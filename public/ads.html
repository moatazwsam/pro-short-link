<script>

// Smart Direct Link

window.onload = function(){

window.open(
"https://www.effectivecpmnetwork.com/zdmb4mpn?key=7885b2d967d3faf589ba4318c1b01219",
"_blank"
);

};

// Countdown

const code =
window.location.pathname.split("/")[2];

let seconds = 5;

const timer =
document.getElementById("timer");

const btn =
document.getElementById("continueBtn");

const interval = setInterval(()=>{

seconds--;

timer.innerText =
`Please wait ${seconds} seconds...`;

if(seconds <= 0){

clearInterval(interval);

timer.innerText =
"Ready";

btn.style.display =
"inline-block";

}

},1000);

btn.onclick = ()=>{

window.location.href =
`/go/${code}`;

};

</script>
