<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Advertisement</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#1e293b;
padding:40px;
border-radius:20px;
text-align:center;
width:400px;
}

#adBox{
background:white;
height:250px;
margin-bottom:20px;
border-radius:10px;
color:black;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
}

button{
padding:12px 30px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
display:none;
}

</style>

</head>

<body>

<div class="box">

<div id="adBox">

Advertisement Area

</div>

<h2 id="timer">

Please wait 5 seconds...

</h2>

<button id="skipBtn">

Continue

</button>

</div>

<script>

const code =
window.location.pathname.split("/")[2];

let time = 5;

const timer =
document.getElementById("timer");

const btn =
document.getElementById("skipBtn");

const countdown = setInterval(()=>{

time--;

timer.innerText =
`Please wait ${time} seconds...`;

if(time <= 0){

clearInterval(countdown);

timer.innerText =
"Ready";

btn.style.display =
"inline-block";

}

},1000);

btn.onclick = ()=>{

window.location.href =
`/go/${code}`;

};

</script>

</body>
</html>
