</head>

<body>

<div class="box">

<h1>Advertisement</h1>

<div id="adBox">

<!-- Native Banner -->

<script async="async" data-cfasync="false" src="https://pl29637398.effectivecpmnetwork.com/9eb780f10b1431432645540d47e47333/invoke.js"></script>

<div class="banner300">

};

</div>

<h2 id="timer">

Please wait 5 seconds...

</h2>

<button id="skipBtn">

Continue

</button>

</div>

<!-- Social Bar -->

<script src="https://pl29637397.effectivecpmnetwork.com/a7/c7/47/a7c747f1cc00e39edadbce306aa8c36f.js"></script>

<!-- Popunder -->

<script src="https://pl29637396.effectivecpmnetwork.com/3f/41/7a/3f417a486e869fdb98c892ef3fca63e0.js"></script>

<script>

window.open(
"https://www.effectivecpmnetwork.com/zdmb4mpn?key=7885b2d967d3faf589ba4318c1b01219",
"_blank"
);

const code =
window.location.pathname.split("/")[2];

let time = 5;

const timer =
document.getElementById("timer");

const btn =
document.getElementById("skipBtn");

const countdown = setInterval(()=>{

time--;

timer.innerText =
`Please wait ${time} seconds...`;

if(time <= 0){

clearInterval(countdown);

timer.innerText =
"Ready";

btn.style.display =
"inline-block";

}

},1000);

btn.onclick = ()=>{

window.location.href =
`/go/${code}`;

};

</script>
